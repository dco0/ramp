<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hyperbolic tiling</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="theme.css" />
        <style>
            div > p {
                display: flex;
                justify-content: space-between;
                margin: 3px;
            }
            #c {
                width: calc(100vw - 14em);
                max-width: calc(100vh - 2em);
            }
        </style>
    </head>
    <body>
        <div style="display: flex;">
            <canvas id="c" width="1000" height="1000"></canvas>
            <div id="options" style="min-width: 12em;">
                <div>
                    <p><span>n:&nbsp;</span> <input type="number" value="4" id="n" style="width: 6em; box-sizing: border-box;" /></p>
                    <p><span>m:&nbsp;</span> <input type="number" value="6" id="m" style="width: 6em; box-sizing: border-box;" /></p>
                    <p><span>tile:&nbsp;</span><select id="t" style="width: 6em; box-sizing: border-box;">
                        <option value="outline">Outline</option>
                        <option value="alternate">Alternate</option>
                        <option value="polya">PolyA</option>
                        <option value="polyb">PolyB</option>
                        <option value="poly2">Poly2</option>
                        <option value="poly3">Poly3</option>
                    </select></p>
                </div>
                <hr />
                <div>
                    <p>fill:</p>
                    <p>
                        <input type="color" id="f1" value="#ffffff" />
                        <input type="color" id="f2" value="#ff0000" />
                        <input type="color" id="f3" value="#0000ff" />
                    </p>
                </div>
                <hr />
                <div>
                    <p>lines:</p>
                    <p>
                        <span><input type="checkbox" id="s1c" />
                        <input type="color" id="s1" value="#000000" /></span>
                        <span><input type="checkbox" id="s2c" checked />
                        <input type="color" id="s2" value="#000000" /></span>
                    </p>
                    <p><input type="range" id="w" min="0" max="5" step="0.33" value="0.33" style="width: 100%;" /></p>
                </div>
                <hr />
                <div>
                    <p><button id="r">Render</button> <button id="s">Save image</button></p>
                </div>
            </div>
        </div>
        <script type="module" src="./tiling.js"></script>
    </body>
</html>
