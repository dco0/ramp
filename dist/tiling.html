<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hyperbolic tiling</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="theme.css" />
        <style>
            div > p {
                display: flex;
                justify-content: space-between;
                margin: 3px;
            }
            #disk {
                width: calc(100vw - 14em);
                max-width: calc(100vh - 2em);
            }
            button {
                text-align: center;
            }
            div > p > * {
                width: 6em;
                box-sizing: border-box;
            }
            .accordion:not(.open) > button::before {
                content: "\25b8";
            }
            .accordion.open > button::before {
                content: "\25be";
            }
            .accordion > button::before {
                color: #333;
            }
            .accordion > button {
                display: block;
                padding-left: 0em;
                background: none;
                border: none;
                font: inherit;
            }
            .accordion:not(.open) > div {
                display: none;
            }
            .swatch { 
                display: flex; 
                align-items: center; 
                gap: 0.2em;
                padding: 0em 0.2em;
                border: 1px solid #ccc; 
                border-radius: 0.2em;
                margin-bottom: 0.2em; 
                background: #fafafa;
            }
            .swatch input {
                width: 100%;
            }
            .swatch.dragging {
                opacity: 0.4;
            }
            .handle {
                cursor: grab;
            }
            .swatch button {
                background: none;
                border: none;
                padding: 0em;
            }
        </style>
    </head>
    <body>
        <div style="display: flex;">
            <canvas id="disk" width="1000" height="1000"></canvas>
            <div id="options" style="min-width: 12em;">
                <div>
                    <p><span>n:&nbsp;</span> <input type="number" value="4" id="n" /></p>
                    <p><span>m:&nbsp;</span> <input type="number" value="6" id="m" /></p>
                </div>
                <hr />
                <div><p>
                    <select id="pattern">
                        <option value="plain">Triangle</option>
                        <option value="polya">PolyA</option>
                        <option value="polyb">PolyB</option>
                        <option value="poly2">Poly2</option>
                        <option value="poly3">Poly3</option>
                    </select>
                    <select id="coloring"></select>
                </p></div>
                <hr />
                <div>
                    <div class="accordion">
                        <button>Fill</button>
                        <div>
                            <div id="swatches">
                                <div></div>
                                <button>Add Color</button>
                            </div>
                        </div>
                    </div>
                    <div class="accordion">
                        <button>Lines</button>
                        <div>
                            <p><input id="width" type="range" min="0" max="5" step="0.33" value="0.33" style="width: 100%;" /></p>
                            <p><input id="stroke" type="color" value="#000000" style="width: 100%;" /></p>
                        </div>
                    </div>
                    <div class="accordion">
                        <button>Back</button>
                        <div>
                            <p><input id="background" type="color" value="#ffffff" style="width: 100%;" /></p>
                        </div>
                    </div>
                    <div class="accordion">
                        <button>Border</button>
                        <div>
                            <p><input id="border" type="color" value="#000000" style="width: 100%;" /></p>
                        </div>
                    </div>
                </div>
                <hr />
                <div>
                    <p>
                        <button id="renderBtn">Render</button>
                        <button id="saveBtn">Save</button>
                    </p>
                </div>
            </div>
        </div>
        <script type="module" src="./tiling.js"></script>
        <script>
            for (let x of document.getElementsByClassName("accordion")) {
                x.firstElementChild.addEventListener("click", (e) => {
                    e.preventDefault();
                    x.classList.toggle("open");
                });
            }
        </script>
    </body>
</html>
